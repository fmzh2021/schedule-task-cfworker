name = "schedule-task-cfworker"
main = "src/index.js"
compatibility_date = "2024-01-01"
# 旧版本预览地址也可能接受旧格式写入；迁移后统一只使用正式入口。
preview_urls = false

# 仅用于旧任务迁移和备份/回滚；正常调度与 CRUD 不访问 KV
[[kv_namespaces]]
binding = "TASKS_KV"
id = "99b84a8990a145ccafaf3550b24dfbee"  # 部署时需要创建 KV 命名空间并填入 ID
preview_id = "99b84a8990a145ccafaf3550b24dfbee"  # 本地开发时使用

# 所有实例通过固定名称 scheduler-tasks-v1 访问同一个强一致任务存储
[[durable_objects.bindings]]
name = "SCHEDULER_STORE"
class_name = "SchedulerStore"

[[migrations]]
tag = "v1-scheduler-store"
new_sqlite_classes = ["SchedulerStore"]

# Cron Triggers - 使用通用触发器，在代码中解析 cron 表达式
# 注意：由于 Cloudflare Workers 限制最多 5 个 cron 触发器
# 我们使用每分钟执行一次的触发器，然后在代码中判断哪些任务应该执行
[triggers]
crons = [
  "* * * * *"  # 每分钟执行一次，代码中会解析任务的 cron 表达式并判断是否执行
]

# 环境变量配置
# 部署时需要在 Cloudflare Dashboard 中设置以下环境变量：
# - API_KEY: API 密钥，用于接口鉴权（强烈建议设置）
#   设置方法：Workers & Pages > 你的 Worker > Settings > Variables > Environment Variables
#   如果没有设置 API_KEY，所有请求将被允许（仅用于开发环境）
#
# 本地开发时可以在 .dev.vars 文件中设置（不会被提交到 Git）：
# API_KEY=your-secret-api-key-here
