name: Verify and deploy scheduler

on:
  push:
    branches: [master, "feature/**", "codex/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test mocked KV, fetch, concurrency and migration
        run: npm test
      - name: Build and test local workerd with SQLite
        run: npm run test:runtime
      - name: Explain initial deployment gate
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.SCHEDULER_AUTO_DEPLOY_ENABLED != 'true'
        run: echo "::notice::Automatic deployment is disabled. Complete the initial deployment and task migration, then set repository variable SCHEDULER_AUTO_DEPLOY_ENABLED=true."

  cloudflare:
    name: Check Cloudflare configuration (read only)
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out expected Worker configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Verify credentials and existing bindings without deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          function fail(message) { console.error(`::error::${message}`); process.exit(1); }
          if (!token || !/^[a-f0-9]{32}$/i.test(account ?? '')) {
            fail('Configure valid repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.');
          }
          const config = readFileSync('wrangler.toml', 'utf8');
          const worker = config.match(/^name\s*=\s*"([a-z0-9-]+)"/m)?.[1];
          const namespace = config.match(/binding\s*=\s*"TASKS_KV"\s*\nid\s*=\s*"([a-f0-9]{32})"/i)?.[1];
          if (!worker || !namespace) fail('Cannot identify expected Worker and TASKS_KV in wrangler.toml.');
          try {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${worker}/settings`, {
              headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(20000),
            });
            // Settings may contain plain-text secrets. Never print the response or remote error messages.
            if (!response.ok) fail(`Cloudflare read-only settings check failed (HTTP ${response.status}).`);
            const data = await response.json();
            if (!data.success || !Array.isArray(data.result?.bindings)) fail('Cloudflare returned invalid Worker settings.');
            const bindings = data.result.bindings;
            if (!bindings.some(b => b.name === 'TASKS_KV' && b.type === 'kv_namespace' && b.namespace_id === namespace)) {
              fail('Production TASKS_KV does not match wrangler.toml; deployment requires review.');
            }
            if (!bindings.some(b => b.name === 'API_KEY' && ['secret_text', 'plain_text'].includes(b.type))) {
              fail('Production Worker API_KEY is missing; configure authentication before deployment.');
            }
            console.log('Cloudflare credentials, target Worker, TASKS_KV and API_KEY binding verified (read only).');
            console.log(bindings.some(b => b.name === 'SCHEDULER_STORE' && b.type === 'durable_object_namespace')
              ? 'SCHEDULER_STORE binding exists. Business data migration must be verified separately.'
              : 'SCHEDULER_STORE binding is absent. Initial deployment and business data migration are still required.');
          } catch {
            fail('Cloudflare read-only check failed due to a network error or invalid response.');
          }
          NODE

  deploy:
    name: Deploy schedule-task-cfworker
    needs: [verify, cloudflare]
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.SCHEDULER_AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: schedule-task-cfworker-production
      cancel-in-progress: false
    steps:
      - name: Check out verified source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Skip a commit superseded on master
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [[ "$GITHUB_SHA" == "$current_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment because master has a newer commit."
          fi
      - name: Set up Node.js
        if: steps.revision.outputs.current == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        if: steps.revision.outputs.current == 'true'
        run: npm ci
      - name: Deploy and preserve Dashboard variables
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          npm run deploy -- --keep-vars
